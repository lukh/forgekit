# References:
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
# https://packaging.python.org/en/latest/guides/packaging-namespace-packages/#native-namespace-packages
# https://packaging.python.org/en/latest/guides/single-sourcing-package-version/
# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freecad-ForgeKit"
dynamic = ["version"]
description = "ForgeKit manages various tools for FrameForge, Plume, and other"
readme = "README.md"
license = "LGPL-2.1-or-later"
license-files = [
    "LICENSE-Code",
    "LICENSE-Assets"
]
maintainers = [
    {name = "Vivien HENRY", email = "vivien.henry@inductivebrain.fr"},
]
requires-python = ">=3.11"


[dependency-groups]
dev = [
    "PySide6",
    "ruff",
    "codespell",
    "freecad-typings",
]

[project.urls]
source = "https://github.com/lukh/forgekit"

[tool.hatch.version]
path = "freecad/ForgeKit/version.py"
# Hatchling looks for __version__ = "..." by default

[tool.hatch.build.targets.wheel]
packages = ["freecad"]
