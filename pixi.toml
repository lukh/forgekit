[project]
authors = ["Vivien HENRY <vivien.henry@inductivebrain.fr>"]
channels = ["freecad/label/dev", "conda-forge"]
description = "ForgeKit manages various tools for FrameForge, Plume, and other"
name = "freecad.ForgeKit"
platforms = ["osx-arm64", "linux-aarch64", "linux-64", "win-64", "osx-64"]
version = "0.1.0"

[pypi-dependencies]
freecad-ForgeKit = { path = ".", editable = true }

[tasks]
test = "python tests/tests.py"

[dependencies]
freecad = ">=1.0.0,<2"